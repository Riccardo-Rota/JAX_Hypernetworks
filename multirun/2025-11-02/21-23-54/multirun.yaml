hydra:
  run:
    dir: runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(purple)sHYDRA%(reset)s] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(blue)s%(name)s%(reset)s][%(log_color)s%(levelname)s%(reset)s]
          - %(message)s'
        log_colors:
          DEBUG: purple
          INFO: green
          WARNING: yellow
          ERROR: red
          CRITICAL: red
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - data.N=100,1000
    - data.n_realizations=1,10
    - targetnetwork=mlp,siren
    - targetnetwork.num_neurons=[1,16,16,1],[1,32,32,1],[1,64,64,1]
  job:
    name: default
    chdir: true
    override_dirname: data.N=100,1000,data.n_realizations=1,10,targetnetwork.num_neurons=[1,16,16,1],[1,32,32,1],[1,64,64,1],targetnetwork=mlp,siren
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/leobock/PACSproject
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/leobock/PACSproject/config
      schema: file
      provider: main
    - path: hydra_plugins.hydra_colorlog.conf
      schema: pkg
      provider: hydra-colorlog
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      data: target_functions
      optimizer: adam_cosine_decay
      hypernetwork: mlp
      targetnetwork: mlp
      training: default
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: colorlog
      hydra/hydra_logging: colorlog
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
training:
  epochs: 10000
  batch_size: 1024
  criterion:
    _target_: losses.L2Loss
  metrics:
    RRMSE:
      _target_: metrics.RRMSE
    MAE:
      _target_: metrics.MAE
    RMSE:
      _target_: metrics.RMSE
  early_stopping:
    _target_: training.EarlyStopping
    patience: 1000
    min_delta: 1.0e-08
  early_stopping_metric: RRMSE
targetnetwork:
  _target_: models.MLP
  num_neurons:
  - 1
  - 8
  - 8
  - 1
  activation_functions:
    _target_: models.get_tanh
  rngs:
    _target_: flax.nnx.Rngs
    default: 0
hypernetwork:
  _target_: models.MLP
  num_neurons:
  - 3
  - 64
  - 64
  - 128
  - null
  activation_functions:
    _target_: models.get_relu
  rngs:
    _target_: flax.nnx.Rngs
    default: 0
optimizer:
  _target_: flax.nnx.Optimizer
  tx:
    _target_: optax.adam
    learning_rate:
      _target_: optax.schedules.cosine_decay_schedule
      init_value: 0.001
      decay_steps: ${compute_train_steps:${training.epochs}, ${data.N}, ${training.batch_size},
        ${data.n_realizations}}
      alpha: 0.0
data:
  _target_: utils.variable_generator.build_function_dataset_from_config
  f_to_learn: 'lambda mu, l, k, x: jnp.exp(-l*x) + mu*x + k*x**2'
  mu_domain:
  - -2
  - 2
  l_domain:
  - 0
  - 1
  k_domain:
  - -2
  - 2
  x_domain:
  - -1
  - 1
  'N': 1000
  n_realizations: 10
  key: 0
inference:
  N_examples: 4
seed: 0
