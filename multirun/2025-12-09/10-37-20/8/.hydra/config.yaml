training:
  epochs: 2000
  batch_size: 1024
  criterion:
    _target_: losses.L2Loss
  metrics:
    RRMSE:
      _target_: metrics.RRMSE
    MAE:
      _target_: metrics.MAE
    RMSE:
      _target_: metrics.RMSE
  early_stopping:
    _target_: training.EarlyStopping
    patience: 500
    min_delta: 1.0e-08
  early_stopping_metric: RRMSE
  learning_rate: 0.001
targetnetwork:
  _target_: models.MLP
  num_neurons:
  - 1
  - 64
  - 64
  - 1
  activation_functions:
    _target_: models.get_tanh
  rngs:
    _target_: flax.nnx.Rngs
    default: 0
  replace_weights: true
hypernetwork:
  _target_: models.MLP
  num_neurons:
  - 3
  - 64
  - 64
  - 128
  - null
  activation_functions:
    _target_: models.get_relu
  rngs:
    _target_: flax.nnx.Rngs
    default: 0
  apply_init_output_layer: ${targetnetwork.replace_weights}
optimizer:
  _target_: flax.nnx.Optimizer
  tx:
    _target_: optax.adam
    learning_rate:
      _target_: optax.schedules.cosine_onecycle_schedule
      peak_value: ${training.learning_rate}
      pct_start: 0.1
      div_factor: 25.0
      final_div_factor: 10000.0
      transition_steps: ${compute_train_steps:${training.epochs}, ${data.N}, ${training.batch_size},
        ${data.n_realizations}}
data:
  _target_: utils.variable_generator.build_function_dataset_from_config
  f_to_learn: 'lambda mu, l, k, x: jnp.exp(-l*x) + mu*x + k*x**2'
  mu_domain:
  - -2
  - 2
  l_domain:
  - 0
  - 1
  k_domain:
  - -2
  - 2
  x_domain:
  - -1
  - 1
  'N': 100
  n_realizations: 100
  key: 0
inference:
  N_examples: 4
seed: 0
