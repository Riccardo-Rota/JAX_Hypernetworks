loss_plots:
  loss_linear:
    _target_: postprocessing.plot_loss_curves

  loss_semilogx:
    _target_: postprocessing.plot_loss_curves
    logx: True

  loss_loglog:
    _target_: postprocessing.plot_loss_curves
    logx: True
    logy: True

output_plots:
  default_predictions:
    _target_: postprocessing.plot_2d_hdf5_comparison
    file_path: ${data_source.test.hdf5_path}
    schema: ${data_source.schema}
    target_keys: ${data_source.base_dataset.target_keys}
    var_keys: ${data_source.base_dataset.var_keys}
    var_bounds: ${data_source.base_dataset.var_bounds}