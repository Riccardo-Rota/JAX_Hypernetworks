hydra:
  job:
    name: default # change name if needed
    chdir: true
  run:
    dir: runs/${now:%Y-%m-%d}/${now:%H-%M-%S}

defaults:
  - training: default
  - targetnetwork: mlp
  - hypernetwork: mlp
  - optimizer: adam_cosine_onecycle
  - data_source: toy
  - postprocessing: toy
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog
  - _self_

seed: 0

targetnetwork:
  num_neurons: [1, 8, 8, 1]
  rngs:
    _target_: flax.nnx.Rngs
    default: ${seed}

hypernetwork:
  num_neurons: [3, 64, 64, 128, null]
  activation_functions:
    _target_: models.get_relu
  rngs:
    _target_: flax.nnx.Rngs
    default: ${seed}
  apply_init_output_layer: ${targetnetwork.replace_weights}

training:
  epochs: 20
  learning_rate: 1.0e-3
  batch_size: 1024
