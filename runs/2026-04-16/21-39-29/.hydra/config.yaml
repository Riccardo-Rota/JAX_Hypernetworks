training:
  epochs: 20
  batch_size: 1024
  learning_rate: 0.001
  in_memory: true
  criterion:
    _target_: losses.L2Loss
  metrics:
    RRMSE:
      _target_: metrics.RRMSE
    MAE:
      _target_: metrics.MAE
    RMSE:
      _target_: metrics.RMSE
  early_stopping:
    _target_: training.EarlyStopping
    patience: 500
    min_delta: 1.0e-08
  early_stopping_metric: RRMSE
optimizer:
  _target_: flax.nnx.Optimizer
  tx:
    _target_: optax.adam
    learning_rate:
      _target_: optax.schedules.cosine_onecycle_schedule
      peak_value: ${training.learning_rate}
      pct_start: 0.1
      div_factor: 25.0
      final_div_factor: 10000.0
      transition_steps: ${compute_train_steps:${training.epochs}, ${runtime.N}, ${training.batch_size}}
data_source:
  train:
    _target_: data.InMemoryHDF5Source
    hdf5_path: ${hydra:runtime.cwd}/data/turbulence_dataset_train.hdf5
  val:
    _target_: data.InMemoryHDF5Source
    hdf5_path: ${hydra:runtime.cwd}/data/turbulence_dataset_val.hdf5
  test:
    _target_: data.InMemoryHDF5Source
    hdf5_path: ${hydra:runtime.cwd}/data/turbulence_dataset_test.hdf5
postprocessing:
  loss_plots:
    loss_linear:
      _target_: postprocessing.plot_loss_curves
    loss_semilogx:
      _target_: postprocessing.plot_loss_curves
      logx: true
    loss_loglog:
      _target_: postprocessing.plot_loss_curves
      logx: true
      logy: true
  output_plots: null
model:
  hyper_block:
    _target_: models.Hypernetwork
    network:
      _target_: models.MLP
      num_neurons:
      - 1
      - 64
      - 64
      - 128
      activation_functions:
        _target_: models.get_tanh
      rngs:
        _target_: flax.nnx.Rngs
        default: ${seed}
      apply_init_output_layer: ${targetnetwork.replace_weights}
    input: hypervars
    output: latent_features
  proj_block:
    _target_: models.ProjectionHead
    in_features: 128
    input: latent_features
    output: weights
    kernel_init:
      _target_: flax.nnx.initializers.lecun_normal
    bias_init:
      _target_: flax.nnx.initializers.zeros_init
    rngs:
      _target_: flax.nnx.Rngs
      params: 42
  target_block:
    _target_: models.TargetNetwork
    network:
      _target_: models.MLP
      num_neurons:
      - 2
      - 8
      - 8
      - 1
      activation_functions:
        _target_: models.get_tanh
      rngs:
        _target_: flax.nnx.Rngs
        default: ${seed}
      replace_weights: true
    input: target_input
    weights:
      all: weights
    output: final_output
  manager:
    _target_: models.HypernetworkManager
    blocks:
    - ${target_block}
    - ${proj_block}
    - ${hyper_block}
    output: final_output
seed: 0
runtime:
  'N': ???
