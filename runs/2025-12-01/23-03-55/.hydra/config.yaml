training:
  epochs: 10
  batch_size: 1024
  criterion:
    _target_: losses.L2Loss
  metrics:
    RRMSE:
      _target_: metrics.RRMSE
    MAE:
      _target_: metrics.MAE
    RMSE:
      _target_: metrics.RMSE
  early_stopping:
    _target_: training.EarlyStopping
    patience: 1000
    min_delta: 1.0e-08
  early_stopping_metric: RRMSE
  learning_rate: 0.05
targetnetwork:
  _target_: models.MLP
  num_neurons:
  - 1
  - 8
  - 8
  - 1
  activation_functions:
    _target_: models.get_tanh
  rngs:
    _target_: flax.nnx.Rngs
    default: 0
hypernetwork:
  _target_: models.MLP
  num_neurons:
  - 3
  - 64
  - 64
  - 128
  - null
  activation_functions:
    _target_: models.get_relu
  rngs:
    _target_: flax.nnx.Rngs
    default: 0
optimizer:
  _target_: flax.nnx.Optimizer
  tx:
    _target_: optax.chain
    _args_:
    - _target_: optax.clip_by_global_norm
      max_norm: 0.5
    - _target_: optax.adam
      learning_rate: ${training.learning_rate}
data:
  _target_: utils.variable_generator.build_function_dataset_from_config
  f_to_learn: 'lambda mu, l, k, x: jnp.exp(-l*x) + mu*x + jnp.sin(k*x)'
  mu_domain:
  - -2
  - 2
  l_domain:
  - 0
  - 1
  k_domain:
  - -2
  - 2
  x_domain:
  - -1
  - 1
  'N': 10000
  n_realizations: 10
  key: 0
inference:
  N_examples: 4
seed: 0
