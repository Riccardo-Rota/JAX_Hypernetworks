optimizer:
  _target_: flax.nnx.Optimizer
  tx:
    _target_: ${ho_func:optax.inject_hyperparams,optax.adam}
    learning_rate:
      _target_: optax.schedules.cosine_onecycle_schedule
      peak_value: ${training.learning_rate}
      pct_start: 0.1
      div_factor: 25.0
      final_div_factor: 10000.0
      transition_steps: ${compute_train_steps:${training.epochs}, ${runtime.N}, ${training.batch_size}}
data_source:
  base_toy:
    _target_: data.ToyDataSource
    f:
      _target_: utils.get_function_from_string
      f_string: theta[0]*x[0] + exp(-theta[1]*x[0]) + sin(theta[2]*pi*x[0])
    hyper_domains:
    - - -2
      - 2
    - - 0
      - 1
    - - -2
      - 2
    var_domains:
    - - -1
      - 1
  train:
    _target_: data.ToyDataSource
    f:
      _target_: utils.get_function_from_string
      f_string: theta[0]*x[0] + exp(-theta[1]*x[0]) + sin(theta[2]*pi*x[0])
    hyper_domains:
    - - -2
      - 2
    - - 0
      - 1
    - - -2
      - 2
    var_domains:
    - - -1
      - 1
    'N': 1000
    n_realizations: 10
    seed: ${seed}
  val:
    _target_: data.ToyDataSource
    f:
      _target_: utils.get_function_from_string
      f_string: theta[0]*x[0] + exp(-theta[1]*x[0]) + sin(theta[2]*pi*x[0])
    hyper_domains:
    - - -2
      - 2
    - - 0
      - 1
    - - -2
      - 2
    var_domains:
    - - -1
      - 1
    'N': 200
    n_realizations: 10
    seed: ${sum:[${seed},1]}
  test:
    _target_: data.ToyDataSource
    f:
      _target_: utils.get_function_from_string
      f_string: theta[0]*x[0] + exp(-theta[1]*x[0]) + sin(theta[2]*pi*x[0])
    hyper_domains:
    - - -2
      - 2
    - - 0
      - 1
    - - -2
      - 2
    var_domains:
    - - -1
      - 1
    'N': 200
    n_realizations: 10
    seed: ${sum:[${seed},2]}
training:
  epochs: 100
  batch_size: 1024
  learning_rate: 0.001
  in_memory: true
  criterion:
    _target_: losses.L2Loss
  metrics:
    RRMSE:
      _target_: metrics.RRMSE
    MAE:
      _target_: metrics.MAE
    RMSE:
      _target_: metrics.RMSE
  early_stopping:
    _target_: flax.training.early_stopping.EarlyStopping
    patience: 500
  early_stopping_metric: RRMSE
  checkpointing_frequency: 20
model:
  hyper_block:
    _target_: models.Hypernetwork
    network:
      _target_: models.MLP
      num_neurons:
      - ${len:${data_source.base_toy.hyper_domains}}
      - 64
      - 64
      - 128
      activation_functions:
        _target_: models.get_tanh
      rngs:
        _target_: flax.nnx.Rngs
        default: ${seed}
    input: hypervars
    output: latent_features
  proj_block_first_kernel:
    _target_: models.SirenHead
    in_features: 128
    input: latent_features
    output: weights_first_kernel
    mode: kernel
    siren_in_features: 1
    rngs:
      _target_: flax.nnx.Rngs
      params: 42
  proj_block_other_kernels:
    _target_: models.SirenHead
    in_features: 128
    input: latent_features
    output: weights_other_kernels
    mode: kernel
    siren_in_features: 1
    rngs:
      _target_: flax.nnx.Rngs
      params: 42
  proj_block_first_biases:
    _target_: models.SirenHead
    in_features: 128
    input: latent_features
    output: first_layer_biases
    mode: bias
    siren_in_features: 1
    rngs:
      _target_: flax.nnx.Rngs
      params: 42
  proj_block_other_biases:
    _target_: models.SirenHead
    in_features: 128
    input: latent_features
    output: other_layer_biases
    mode: bias
    siren_in_features: 1
    rngs:
      _target_: flax.nnx.Rngs
      params: 42
  target_first_layer:
    _target_: models.TargetNetwork
    network:
      _target_: models.Siren
      w0_first: 30.0
      w0_last: 30.0
      w0_other: 30.0
      num_neurons:
      - 1
      - 8
      rngs:
        _target_: flax.nnx.Rngs
        default: ${seed}
    input: vars
    weights_mapping:
      bias: first_layer_biases
      kernel: weights_first_kernel
    output: first_layer_output
  target_other_layers:
    _target_: models.TargetNetwork
    network:
      _target_: models.Siren
      w0_first: 30.0
      w0_last: 30.0
      w0_other: 30.0
      num_neurons:
      - 8
      - 8
      - 1
      rngs:
        _target_: flax.nnx.Rngs
        default: ${seed}
    input: first_layer_output
    weights_mapping:
      bias: other_layer_biases
      kernel: weights_other_kernels
    output: final_output
  manager:
    _target_: models.HypernetworkManager
    blocks:
    - ${model.target_first_layer}
    - ${model.target_other_layers}
    - ${model.proj_block_first_kernel}
    - ${model.proj_block_other_kernels}
    - ${model.proj_block_first_biases}
    - ${model.proj_block_other_biases}
    - ${model.hyper_block}
    output: final_output
postprocessing:
  loss_plots:
    loss_linear:
      _target_: postprocessing.plot_loss_curves
    loss_semilogx:
      _target_: postprocessing.plot_loss_curves
      logx: true
    loss_loglog:
      _target_: postprocessing.plot_loss_curves
      logx: true
      logy: true
  output_plots:
    default_predictions:
      _target_: postprocessing.generate_toy_plots
      hypervars_set:
      - - 0.5
        - 0.5
        - 0.5
      - - 1.0
        - 0.5
        - 1.0
      - - -1.0
        - 0.5
        - -1.0
      - - -0.5
        - 1.0
        - 2.0
      var_domains: ${data_source.base_toy.var_domains}
      exact_function: ${data_source.base_toy.f}
      n_points: 400
problem_name: toy
dataset_root: ${hydra:runtime.cwd}/datasets
seed: 0
runtime:
  'N': ???
